services:
  db:
    image: postgres:18-alpine
    container_name: kong-db
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      timeout: 10s
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=db
    volumes:
      - db-data:/var/lib/postgresql

  redis-om:
    image: redis/redis-stack:7.2.0-v20
    container_name: kong-redis-om
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis-om-data:/data

  mail:
    image: axllent/mailpit:v1.29
    container_name: kong-mail
    ports:
      - "8025:8025"
      - "1025:1025"

  backend:
    image: kong-backend:latest
    container_name: kong_backend
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis-om:
        condition: service_started
      mail:
        condition: service_healthy
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=db
      - DATABASE_URL=postgres://user:password@db:5432/db
      - REDIS_URL=redis://redis-om:6379/0
      - MAIL_HOST=mail
      - MAIL_PORT=1025
      - MAIL_USER=user
      - MAIL_PASS=pass
      - ACCESS_JWT_SECRET=test
      - REFRESH_JWT_SECRET=test1
      - ACCESS_JWT_EXPIRES_IN=300
      - REFRESH_JWT_EXPIRES_IN=2592000
      - OTP_SECRET=test
      - OTP_ALPHABET=ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789
      - OTP_SIZE=6
      - OTP_EXPIRES_IN=300
      - CORS_ORIGIN=https://localhost:3001
      - SERVER_PORT=3000
    command: sh -c "npx prisma migrate deploy && node dist/src/main"
    volumes:
      - ./certs:/app/certs:ro

volumes:
  db-data:
  redis-om-data:
